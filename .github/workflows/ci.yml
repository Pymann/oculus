name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      aiml_ref:
        description: "Which aiml build to take from Kontor (a commit sha of Pymann/aiml); empty = the pinned one"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The aiml v2 line (Pymann/aiml masterv2) that Oculus is built with.  Its CI puts
  # every build into Kontor as generic/aiml/<commit>/aiml-x86_64-linux.tar.gz.
  AIML_PINNED_REF: 9658e822278e32cb407029729907f24ff4b758db

jobs:
  build:
    name: Build and test (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The venv layout (bin/aiml, lib/libaiml.so, lib/<bundled libraries>, env) of
      # aiml spec/68.  The repo holds the reader credentials as AIML_KONTOR_*;
      # KONTOR_* is the fallback.
      - name: Install aiml from Kontor
        env:
          KONTOR_URL: ${{ secrets.AIML_KONTOR_URL || secrets.KONTOR_URL }}
          KONTOR_TOKEN: ${{ secrets.AIML_KONTOR_TOKEN || secrets.KONTOR_TOKEN }}
          KONTOR_CA: ${{ secrets.AIML_KONTOR_CA || secrets.KONTOR_CA }}
          AIML_REF: ${{ inputs.aiml_ref }}
        run: |
          set -eu
          missing=""
          for v in KONTOR_URL KONTOR_TOKEN KONTOR_CA; do
            [ -n "${!v:-}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Kontor not configured, missing:$missing (repo secrets AIML_KONTOR_URL/_TOKEN/_CA)"
            exit 1
          fi
          ref="${AIML_REF:-$AIML_PINNED_REF}"
          work="$RUNNER_TEMP/kontor"
          venv="$RUNNER_TEMP/aiml-venv"
          mkdir -p "$work" "$venv"
          printf '%s\n' "$KONTOR_CA" > "$work/ca.crt"
          # No `curl -k`: the token must not go to a server we did not verify.
          curl --silent --show-error --fail-with-body --max-time 600 \
               --cacert "$work/ca.crt" \
               -H "Authorization: Bearer $KONTOR_TOKEN" \
               -o "$work/aiml.tar.gz" "${KONTOR_URL%/}/generic/aiml/${ref}/aiml-x86_64-linux.tar.gz"
          tar -xzf "$work/aiml.tar.gz" -C "$venv"
          rm -rf "$work"
          test -x "$venv/bin/aiml"
          test -f "$venv/lib/libaiml.so"
          # What `. <venv>/env` sets (aiml spec/68 section 3).
          echo "AIML_VENV=$venv" >> "$GITHUB_ENV"
          echo "AIML=$venv/bin/aiml" >> "$GITHUB_ENV"
          echo "$venv/bin" >> "$GITHUB_PATH"
          echo "installed aiml ${ref} into $venv"

      # The newest stable LLVM from apt.llvm.org; the Clang worker is built against it.
      - name: Install LLVM
        run: |
          set -eu
          curl --silent --show-error --fail -o "$RUNNER_TEMP/llvm.sh" https://apt.llvm.org/llvm.sh
          ver="$(sed -n 's/^CURRENT_LLVM_STABLE=\([0-9][0-9]*\).*/\1/p' "$RUNNER_TEMP/llvm.sh")"
          [ -n "$ver" ] || { echo "::error::no CURRENT_LLVM_STABLE in llvm.sh"; exit 1; }
          sudo bash "$RUNNER_TEMP/llvm.sh" "$ver"
          sudo apt-get install -y "libclang-$ver-dev" "libclang-cpp$ver-dev" "llvm-$ver-dev"
          echo "LLVM_CONFIG=/usr/lib/llvm-$ver/bin/llvm-config" >> "$GITHUB_ENV"
          echo "installed LLVM $ver"

      - name: Build
        run: aiml build

      - name: Build the Clang worker
        run: worker/build.sh

      - name: Test
        run: tests/run_tests.sh out/oculus/oculus
